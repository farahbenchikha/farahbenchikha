<svg width="1200" height="560" viewBox="0 0 1200 560"
  xmlns="http://www.w3.org/2000/svg">

  <defs>

```
<!-- BACKGROUND -->
<linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#071417"/>
  <stop offset="55%" stop-color="#091B1E"/>
  <stop offset="100%" stop-color="#0D2427"/>
</linearGradient>

<!-- PANEL -->
<linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#0D2023"/>
  <stop offset="100%" stop-color="#102A2D"/>
</linearGradient>

<!-- PHOTO CLIP -->
<clipPath id="photoClip">
  <circle cx="275" cy="270" r="126"/>
</clipPath>

<!-- GLOW -->
<filter id="softGlow"
        x="-50%"
        y="-50%"
        width="200%"
        height="200%">

  <feGaussianBlur
    stdDeviation="4"
    result="blur"/>

  <feMerge>
    <feMergeNode in="blur"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>

</filter>

<!-- GRID -->
<pattern
  id="grid"
  width="32"
  height="32"
  patternUnits="userSpaceOnUse">

  <path
    d="M 32 0 L 0 0 0 32"
    fill="none"
    stroke="#163437"
    stroke-width="0.6"
    opacity="0.35"/>

</pattern>
```

